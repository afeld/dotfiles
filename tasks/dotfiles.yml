- name: List dotfiles
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/dotfiles"
    hidden: true
  register: dotfiles

- name: Symlink dotfiles
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "~/.{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ dotfiles.files | sort(attribute='path') }}"

# one source of instructions about my writing and coding style, for each agent's global instructions file
- name: Create agent config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ~/.claude
    - ~/.codex
    - ~/.gemini

- name: Symlink global agent instructions
  ansible.builtin.file:
    src: "{{ playbook_dir }}/agents/AGENTS.md"
    dest: "{{ item }}"
    state: link
    force: true
  loop:
    # Claude Code
    # https://code.claude.com/docs/en/memory
    - ~/.claude/CLAUDE.md
    # Codex
    # https://learn.chatgpt.com/docs/agent-configuration/agents-md
    - ~/.codex/AGENTS.md
    # Gemini CLI
    # https://geminicli.com/docs/cli/gemini-md/
    - ~/.gemini/GEMINI.md
    # Snowflake Cortex Code
    # https://www.snowflake.com/en/developers/guides/create-snowflake-guides-with-agents-md/
    - ~/.snowflake/cortex/AGENTS.md

- name: Symlink Snowflake Cortex Code hooks
  ansible.builtin.file:
    src: "{{ playbook_dir }}/snowflake/cortex/hooks.json"
    dest: ~/.snowflake/cortex/hooks.json
    state: link
    force: true
