# https://pawelgrzybek.com/change-macos-user-preferences-via-command-line/

# https://apple.stackexchange.com/a/340175/39927
- name: Disable screenshot previews
  community.general.osx_defaults:
    domain: com.apple.screencapture
    key: show-thumbnail
    type: bool
    value: false
  notify: Restart SystemUIServer

# https://macos-defaults.com/screenshots/type.html
- name: Set screenshot format to JPEG
  community.general.osx_defaults:
    domain: com.apple.screencapture
    key: type
    type: string
    value: png
  notify: Restart SystemUIServer

- name: Auto-hide the Dock
  community.general.osx_defaults:
    domain: com.apple.dock
    key: autohide
    type: int
    value: 1
  notify: Restart Dock

- name: Turn on tap-to-click
  community.general.osx_defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: Clicking
    type: int
    value: 1

- name: Enable Touch ID for sudo
  become: true
  block:
    - name: Read the sudo_local template
      ansible.builtin.slurp:
        src: /etc/pam.d/sudo_local.template
      register: sudo_local_template

    - name: Build desired sudo_local contents with Touch ID enabled
      ansible.builtin.set_fact:
        sudo_local_content: >-
          {{
            (sudo_local_template.content | b64decode)
            | regex_replace('(?m)^#?\s*auth\s+sufficient\s+pam_tid\.so\s*$', 'auth sufficient pam_tid.so')
          }}

    - name: Write sudo_local only when the desired file differs
      ansible.builtin.copy:
        content: "{{ sudo_local_content }}"
        dest: /etc/pam.d/sudo_local
        owner: root
        group: wheel
        mode: "0644"
